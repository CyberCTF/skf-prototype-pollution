# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP SKF Prototype Pollution (OWASP Security Knowledge Framework labs, by Glenn ten Cate, Riccardo ten Cate and the SKF contributors) as an Isoloom spec:
# an Express app that merges user JSON into objects with a vulnerable lodash (prototype pollution). The SKF lab folder nodeJs/Prototype-Pollution is
# vendored unchanged in build/web/app/ and built by an overlay of its Dockerfile (build/web/Dockerfile).
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: skf-prototype-pollution

networks:
  lab: { cidr: 10.60.167.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 5000, name: web, http: true, publish: 5050 }]
    resources: { cpus: 1, memory_mb: 384 }
    docker:
      build: build/web

checks:
  - name: the lab answers
    http: http://web:5000/
    wait: 120
  - name: the registration page answers
    script: checks/register.sh

message: |
  OWASP SKF Prototype Pollution answers at http://localhost:{{ machines.web.services.0.publish }}/.
  Look at how your account details are merged on the server.
